name: CI

# Checks every push and pull request (lint, unit and recognition tests,
# browser test) and publishes main to krisperapps.de.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci
      - name: Ruff (tools/*.py)
        run: |
          pipx run ruff check tools
          pipx run ruff format --check tools
      # Test photos are generated by tools/synth.py from tests/fixtures/picture.jpg.
      - run: pip install pillow numpy
      - run: npm test
      # Chrome is preinstalled on the runner.
      - run: npm run test:e2e

  # Tags every tested commit on main with the next patch version (vX.Y.Z).
  version:
    name: Version tag
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: python3 .github/scripts/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}

  site:
    name: Assemble site
    # Only commits that got a version tag: a re-run of an older run deploys nothing.
    needs: [check, version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stamp version
        run: node tools/stamp-version.mjs "${{ needs.version.outputs.version }}"
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css app.js worker.js sw.js manifest.webmanifest core icons vendor _site/
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site

  # Publishes them to the own server (https://puzzle.krisperapps.de/). The key may
  # only write into this app's folder there; this job runs no code from the repo.
  server:
    name: krisperapps.de
    needs: [site]
    runs-on: ubuntu-latest
    concurrency:
      group: server
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - name: Upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo 'krisperapps.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMchrlhQI1OFJ2cEfQosiydiSPg498c/+Mggebk+zVLO' > ~/.ssh/known_hosts
          rsync -rtz --delete -e 'ssh -i ~/.ssh/deploy' _site/ deploy@krisperapps.de:./
